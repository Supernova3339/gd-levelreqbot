<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            margin: 6px;
            height: calc(100% - 12px);
            background: #0f0f18;
            border: 1px solid #252540;
            border-radius: 10px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(99, 102, 241, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Main content row */
        .body {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 2px;
            background: #4ade80;
            box-shadow: 0 0 6px #4ade8088;
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 2px;
            color: #22c55e;
        }

        .level-id {
            font-size: 20px;
            font-weight: 700;
            font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
            color: #f1f1f1;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .sub {
            font-size: 10px;
            color: #333;
            margin-top: 1px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .close {
            background: none;
            border: none;
            color: #2a2a2a;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 3px;
            flex-shrink: 0;
            align-self: flex-start;
        }

        .close:hover {
            color: #888;
        }

        /* Countdown bar */
        .bar {
            height: 2px;
            flex-shrink: 0;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.08s linear;
            background: linear-gradient(90deg, #16a34a, #4ade80);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="body">
        <div class="dot"></div>
        <div class="info">
            <div class="label">Copied to Clipboard</div>
            <div class="level-id" id="level-id">—</div>
            <div class="sub">ready to paste in Geometry Dash</div>
        </div>
        <button class="close" onclick="dismiss()">×</button>
    </div>
    <div class="bar">
        <div class="bar-fill" id="bar" style="width:100%"></div>
    </div>
</div>

<script>
    const DURATION = 5500;
    let timer = null, rafId = null, deadline = null;

    function dismiss() {
        clearTimeout(timer);
        cancelAnimationFrame(rafId);
        try {
            window.__TAURI__.core.invoke('dismiss_level_overlay');
        } catch {
        }
    }

    function tick() {
        if (!deadline) return;
        const pct = Math.max(0, ((deadline - Date.now()) / DURATION) * 100);
        document.getElementById('bar').style.width = pct + '%';
        if (pct > 0) rafId = requestAnimationFrame(tick);
    }

    function startCountdown() {
        clearTimeout(timer);
        cancelAnimationFrame(rafId);
        deadline = Date.now() + DURATION;
        document.getElementById('bar').style.width = '100%';
        rafId = requestAnimationFrame(tick);
        timer = setTimeout(dismiss, DURATION);
    }

    async function positionWindow() {
        try {
            const pos = localStorage.getItem('gdlqbot.overlay_position') || 'bottom-right';
            const win = window.__TAURI__.window.getCurrentWindow();
            const mon = await win.currentMonitor();
            if (!mon) return;
            const sw = mon.size.width, sh = mon.size.height;
            const sf = mon.scaleFactor || 1;
            // Window outer size in logical pixels (approximate)
            const ww = Math.round(380 * sf), wh = Math.round(120 * sf);
            const margin = Math.round(16 * sf);
            let x, y;
            if (pos === 'top-left') {
                x = margin;
                y = margin;
            } else if (pos === 'top-right') {
                x = sw - ww - margin;
                y = margin;
            } else if (pos === 'bottom-left') {
                x = margin;
                y = sh - wh - margin;
            } else {
                x = sw - ww - margin;
                y = sh - wh - margin;
            } // bottom-right
            await win.setPosition({type: 'Physical', x, y});
        } catch {
        }
    }

    function showCopied(payload) {
        const id = typeof payload === 'string' && payload.startsWith('"') ? JSON.parse(payload) : payload;
        document.getElementById('level-id').textContent = String(id ?? '—');
        startCountdown();
    }

    (function waitForTauri() {
        if (typeof window.__TAURI__ === 'undefined') {
            setTimeout(waitForTauri, 30);
            return;
        }

        // Hide immediately on load — prevents the flash on window creation
        try {
            window.__TAURI__.window.getCurrentWindow().hide();
        } catch {
        }

        window.__TAURI__.event.listen('show-level-copied', async e => {
            await positionWindow();
            showCopied(e.payload);
            try {
                const win = window.__TAURI__.window.getCurrentWindow();
                await win.show();
            } catch {
            }
        });
    })();
</script>
</body>
</html>
