<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GD Level Request Bot</title>
    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
        }

        /* Covers the gap between the window painting this document and React
           mounting (fetching/parsing/executing the JS bundle) — plain CSS,
           so it shows immediately with no JS required. React's root render
           replaces #root's contents, so this never has to be torn down
           explicitly. */
        .boot-spinner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .boot-spinner div {
            width: 22px;
            height: 22px;
            border: 2px solid #1e1e1e;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: boot-spin 0.65s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<div id="root">
    <div class="boot-spinner">
        <div></div>
    </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
