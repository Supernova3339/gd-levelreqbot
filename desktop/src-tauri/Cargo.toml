[workspace]
members = [".", "cli", "watchdog"]
resolver = "2"

[package]
name = "gdlqbot"
version = "0.1.1"
description = "GD Level Request Bot — desktop app"
authors = ["Supernova3339"]
edition = "2021"

[lib]
name = "gdlqbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework (internal REST API + IPC bridge)
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

# Twitch IRC
twitch-irc = { version = "5", default-features = false, features = ["transport-tcp", "transport-tcp-native-tls", "refreshing-token-native-tls"] }

# HTTP client (Twitch Helix API, YouTube API)
# "stream" is needed by download_capped() in commands/marketplace.rs, which
# streams package downloads so it can abort once a size cap is exceeded
# instead of buffering the whole (possibly huge/malicious) response first.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Twitch EventSub (channel-point redemptions) — WebSocket client
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Config
dirs = "5"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
async-trait = "0.1"

# Opens browser for auth service flow
opener = "0.7"
base64 = "0.22"
async-recursion = "1.1.1"

# GD account auth (GJP2 + encrypted storage)
sha1    = "0.10"
sha2    = "0.10"
hex     = "0.4"
aes-gcm = "0.10"

# Scripting engine
rhai = { version = "1", features = ["serde", "sync"] }

# Module packaging (.gdmod = zip)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Semantic version comparison
semver = "1"

# PNG encoding for preview screen stream
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

