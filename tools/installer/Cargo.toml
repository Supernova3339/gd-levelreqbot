[package]
name = "gdlqb-installer"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[[bin]]
name = "gdlqb-installer"
path = "src/main.rs"

[features]
# Serve the embedded ui/dist instead of devUrl. build.mjs always enables
# this; only `tauri dev` (hot reload) runs without it.
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
dirs = "5"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Blocking HTTP client for the developer-login role check (GET .../me) —
# deliberately not reqwest/tokio: this installer has no async runtime, and a
# single short-lived synchronous request doesn't need one.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
strip = true
